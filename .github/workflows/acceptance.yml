name: Release acceptance
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Optional Actions run containing a source-live-evidence artifact for this exact converter revision'
        required: false
        type: string
  push:
    tags: ['v*']
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PFX2GAS_UID: 1001
      PFX2GAS_GID: 1001
    steps:
      - uses: actions/checkout@v4
      - run: ./pfx2gas build
      - run: ./pfx2gas build browser
      - uses: actions/download-artifact@v4
        if: github.event.inputs.evidence_run_id != ''
        with:
          name: source-live-evidence
          path: .artifacts/acceptance
          run-id: ${{ github.event.inputs.evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Required apps, workflows, original comparisons and live evidence
        run: ./pfx2gas browser scripts/acceptance_check.py --run --require-source-comparison --require-live-google
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-evidence
          path: |
            .artifacts/acceptance
            .artifacts/browser
            .artifacts/microsoft
          if-no-files-found: error
