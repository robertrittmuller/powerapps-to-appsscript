name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Python suite
        run: uv run pytest -q

      - name: JS runtime suite
        run: node --test tests/js/*.js

      - name: Emitter↔runtime consistency gate
        run: uv run python scripts/check_runtime_consistency.py

      - name: Fetch real-app sample corpus (public source repo)
        run: uv run python scripts/fetch_samples.py

      - name: Real-app soak (convert + validate every sample)
        env:
          PFX2GAS_SOAK_OUT: ${{ github.workspace }}/.artifacts/benchmark
        run: uv run python scripts/soak_check.py

      - name: Publish compatibility benchmark scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-benchmark
          path: |
            .artifacts/benchmark/benchmark-scorecard.json
            .artifacts/benchmark/benchmark-scorecard.md
          if-no-files-found: error

  # The packaged toolchain (Python + Node + clasp) must itself stay working
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PFX2GAS_UID: 1001   # runner user; containers write host-owned files
      PFX2GAS_GID: 1001
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build pfx2gas

      - name: Test suite in container
        run: docker compose run --rm test

      - name: CLI smoke — convert a fixture, validate it, syntax-check the .gs
        run: |
          docker compose run --rm pfx2gas convert tests/fixtures/fixtureB.msapp -o /workspace/.tmp-container-smoke
          docker compose run --rm pfx2gas validate /workspace/.tmp-container-smoke
          docker compose run --rm --entrypoint /bin/bash pfx2gas -c \
            'cp /workspace/.tmp-container-smoke/Code.gs /tmp/c.js && node --check /tmp/c.js'
          rm -rf .tmp-container-smoke

      - name: Wrapper smoke (any-directory usage, host-path translation)
        run: |
          cd "$GITHUB_WORKSPACE"
          ./pfx2gas clasp --version
          ./pfx2gas convert tests/fixtures/fixtureA.msapp -o /tmp/wrapper-smoke
          ./pfx2gas validate /tmp/wrapper-smoke
          test -f /tmp/wrapper-smoke/Code.gs
