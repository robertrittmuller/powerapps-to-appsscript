services:
  browser:
    image: pfx2gas-browser:latest
    build:
      context: .
      dockerfile: Dockerfile.browser
    working_dir: /workspace
    user: "${PFX2GAS_UID:-1000}:${PFX2GAS_GID:-1000}"
    init: true
    shm_size: 1gb
    environment:
      - PYTHONPATH=/workspace/src
    volumes:
      - .:/workspace

  # Containers run as the invoking user's uid (PFX2GAS_UID/GID, defaults to
  # 1000) so files written into /workspace stay owned by the host user.
  # On Linux hosts run: export PFX2GAS_UID=$(id -u) PFX2GAS_GID=$(id -g)
  # (Docker Desktop maps ownership automatically; the default is fine there.)

  # The converter CLI. Inputs/outputs live on the host via the /workspace
  # mount: docker compose run --rm pfx2gas convert /workspace/app.msapp -o /workspace/output/app
  pfx2gas:
    build: .
    image: pfx2gas:latest
    working_dir: /workspace
    user: "${PFX2GAS_UID:-1000}:${PFX2GAS_GID:-1000}"
    volumes:
      - .:/workspace
    environment:
      - PFX2GAS_LLM_BASE_URL
      - PFX2GAS_LLM_API_KEY
      - PFX2GAS_LLM_MODEL
      - PFX2GAS_SAMPLES_DIR=/workspace/samples/real
    env_file:
      - path: .env
        required: false

  # Full verification: Python + JS suites, consistency gate. Runs against the
  # mounted repo (the baked-in /app copy has no sample corpus by design).
  test:
    image: pfx2gas:latest
    build: .
    working_dir: /workspace
    user: "${PFX2GAS_UID:-1000}:${PFX2GAS_GID:-1000}"
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace/src
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/app/.venv/bin/python -m pytest -q &&
       node --test tests/js/*.js &&
       /app/.venv/bin/python scripts/check_runtime_consistency.py"

  # Real-app soak in a clean environment; downloads cache on the host.
  soak:
    image: pfx2gas:latest
    build: .
    working_dir: /workspace
    user: "${PFX2GAS_UID:-1000}:${PFX2GAS_GID:-1000}"
    volumes:
      - .:/workspace
    environment:
      - PFX2GAS_SAMPLES_DIR=/workspace/samples/real
      - PYTHONPATH=/workspace/src
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/app/.venv/bin/python scripts/fetch_samples.py &&
       /app/.venv/bin/python scripts/soak_check.py"

  # clasp with persistent login state (project-local .clasp-home/, gitignored).
  # One-time: docker compose run --rm clasp login --no-localhost
  # Then:     docker compose run --rm -w /workspace/output/<App> clasp create --title X --type webapp
  #           docker compose run --rm -w /workspace/output/<App> clasp push --force
  #           docker compose run --rm -w /workspace/output/<App> clasp deploy
  clasp:
    image: pfx2gas:latest
    build: .
    working_dir: /workspace
    user: "${PFX2GAS_UID:-1000}:${PFX2GAS_GID:-1000}"
    volumes:
      - .:/workspace
      - ./.clasp-home:/home/pfx
    entrypoint: ["clasp"]
    command: ["--version"]
