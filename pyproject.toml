[project]
name = "pfx2gas"
version = "0.2.0rc1"
description = "Convert Microsoft PowerApps canvas apps to Google Apps Script web apps"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "openai>=1.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
pfx2gas = "pfx2gas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfx2gas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/fixtures/build.py"
